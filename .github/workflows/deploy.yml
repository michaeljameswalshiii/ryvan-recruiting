# Deploy to Vercel from GitHub Actions
name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pdfjs-dist requires modern Node
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        # Use npm install (not npm ci only) so deploy is resilient if lock drifts
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Avoid hard fail on env-only checks during CI build when secrets are Vercel-side
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
